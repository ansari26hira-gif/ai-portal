<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-Powered Secure Document Search Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header><h1>🔒 AI Secure Doc Portal</h1><p>Batch 1 - Web Dev | Hira Ansari</p></header>
<section id="loginScreen" class="screen active">
<div class="card"><h2>1. Login Screen</h2>
<label>Email</label><input type="email" id="email" value="hira@student.com">
<label>Password</label><input type="password" value="123456">
<button class="btn primary" onclick="doLogin()">Login</button></div>
</section>
<section id="uploadScreen" class="screen">
<div class="card"><h2>2. Document Upload Portal</h2>
<div id="dropZone" class="dropzone"><div>⬆</div><p><b>Drag & drop files here</b></p>
<input type="file" id="fileInput" multiple hidden>
<button class="btn" onclick="fileInput.click()">Browse Files</button></div>
<h3>Uploaded Files (<span id="fileCount">0</span>)</h3><ul id="fileList"></ul>
<button class="btn primary" id="continueBtn" onclick="goToChat()" disabled>Continue to Search</button></div>
</section>
<section id="chatScreen" class="screen">
<div class="card"><h2>3. AI Chat Box</h2><div id="chatBox" class="chatbox"><div class="msg ai">AI: Hello Hira! Ask me about your docs</div></div>
<div class="chat-input"><input type="text" id="qInput" placeholder="Ask..."><button class="btn primary" onclick="askAI()">Send</button></div>
</div>
</section>
</div>
<script src="script.js"></script>
</body>
</html>
